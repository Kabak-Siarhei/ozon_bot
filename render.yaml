# Blueprint Render: Telegram-бот как Background Worker.
# Бот работает через long polling и не нуждается во входящем HTTP.
# Если сервис всё же создан как Web Service — bot.c поднимет health-сервер
# на PORT, чтобы Render не убил контейнер по port scan.
services:
  - type: worker
    name: ozon-ttn-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Токен от @BotFather — вводится в дашборде Render, не хранится в репо.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Настройки полей (SQLite) — эфемерный диск: сбрасываются при рестарте.
      - key: BOT_DB
        value: /tmp/bot_settings.db
